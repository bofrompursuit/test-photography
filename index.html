<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bo Moldenhauer — Portfolio</title>
  <meta name="description" content="Bo Moldenhauer — B2B Solutions Architect and AI Product Engineer. Less noise. Better builds." />

  <!-- App icon / home-screen install -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Forth Studios brand type, used only by its "Content Needs" contact card. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Courier+Prime:wght@400;700&display=swap" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bo." />
</head>
<body>
  <div class="grain"></div>

  <header class="site-header" data-header>
    <a class="brand" href="#hero">Bo.</a>
    <nav class="nav">
      <a href="#hero" data-home>Home</a>
      <a href="#work">Work</a>
      <a href="#starter-project">Start a project</a>
      <a href="#connect">Contact</a>
    </nav>
  </header>

  <main>
    <!-- HERO: fullscreen video, pinned + scrubbed while scrolling -->
    <section id="hero" class="hero" data-hero>
      <div class="hero-video-wrap" data-hero-video-wrap>
        <video
          class="hero-video"
          data-hero-video
          muted
          loop
          playsinline
          preload="auto"
        >
          <source src="/assets/video/orb.mp4" type="video/mp4" />
        </video>
        <div class="hero-video-fallback" data-hero-fallback aria-hidden="true"></div>
      </div>

      <div class="hero-content">
        <p class="hero-name" data-hero-reveal>Bo Moldenhauer</p>
        <p class="eyebrow" data-hero-reveal>B2B Solutions Architect + AI Product Engineer</p>
        <h1 class="hero-title">
          <span data-hero-reveal>Less noise.</span>
          <span data-hero-reveal>Better builds.</span>
        </h1>
      </div>

      <div class="scroll-cue" data-hero-reveal>
        <span>Scroll</span>
        <div class="scroll-cue-line"><i></i></div>
      </div>
    </section>

    <!-- WORK: React + Framer Motion showcase (src/showcase) -->
    <section id="work" class="section work section--flush">
      <div id="showcase-root"></div>
    </section>

    <!-- STARTER PROJECT: 6-step intake form that ends in booking a call (src/starter) -->
    <section id="starter-project" class="section section--starter">
      <div id="starter-root"></div>
    </section>

    <!-- CONTACT & CONNECT: hand-reveal video into holographic action cards (src/connect) -->
    <section id="connect" class="section connect section--flush">
      <div id="connect-root"></div>
    </section>
  </main>

  <!-- Footer (copyright + ambient music toggle) is baked into the reveal video
       overlay in src/connect/ConnectSection.jsx, not a standalone element here. -->

  <script type="module" src="/src/main.js"></script>
</body>
</html>
